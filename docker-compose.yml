version: '3.8'

services:
  # PostgreSQL - Relational metadata store
  postgres:
    image: postgres:16-alpine
    container_name: km_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge} -d ${POSTGRES_DB:-knowledge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - knowledge_network
    restart: unless-stopped

  # MongoDB - Document content store
  mongodb:
    image: mongo:7.0
    container_name: km_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-knowledge}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change_me_in_production}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-knowledge_db}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - knowledge_network
    restart: unless-stopped

  # ChromaDB - Vector store (MVP)
  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: km_chromadb
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - knowledge_network
    restart: unless-stopped

  # Redis - Session store & pub/sub
  redis:
    image: redis:7-alpine
    container_name: km_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - knowledge_network
    restart: unless-stopped

  # Zookeeper - Required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: km_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - knowledge_network
    restart: unless-stopped

  # Kafka - Message broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: km_kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - knowledge_network
    restart: unless-stopped

  # RabbitMQ - Message broker with management UI
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: km_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-knowledge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change_me_in_production}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - knowledge_network
    restart: unless-stopped

  # Core API - Python FastAPI (placeholder for Phase 2)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: km_api
    environment:
      - ENVIRONMENT=development
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-knowledge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me_in_production}
      - POSTGRES_DB=${POSTGRES_DB:-knowledge_db}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_USER:-knowledge}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-change_me_in_production}
      - MONGO_DB=${MONGO_DB:-knowledge_db}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_HOST=kafka
      - KAFKA_PORT=29092
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-knowledge}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-change_me_in_production}
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - knowledge_network
    restart: unless-stopped
    profiles:
      - with-app

  # Ingestion Worker - Python async worker (placeholder for Phase 3)
  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: km_ingestion
    environment:
      - ENVIRONMENT=development
      - API_URL=http://api:8000
      - POSTGRES_HOST=postgres
      - MONGO_HOST=mongodb
      - CHROMA_HOST=chromadb
      - REDIS_HOST=redis
      - KAFKA_HOST=kafka
      - KAFKA_PORT=29092
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./data/ingestion:/data:ro
      - ./ingestion:/app:ro
    depends_on:
      - api
      - kafka
      - rabbitmq
    networks:
      - knowledge_network
    restart: unless-stopped
    profiles:
      - with-app

  # BFF - Node.js Backend for Frontend (placeholder for Phase 5)
  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
    container_name: km_bff
    environment:
      - NODE_ENV=development
      - API_URL=http://api:8000
      - REDIS_URL=redis://redis:6379
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET:-change_me_in_production}
    ports:
      - "3000:3000"
    volumes:
      - ./bff:/app:ro
    depends_on:
      - api
      - redis
    networks:
      - knowledge_network
    restart: unless-stopped
    profiles:
      - with-app

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  chromadb_data:
    driver: local
  redis_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  knowledge_network:
    driver: bridge
    name: knowledge_network
