name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  API_IMAGE: knowledge-api
  BFF_IMAGE: knowledge-bff

jobs:
  # ==========================================================
  # TEST STAGE
  # ==========================================================
  test-api:
    name: Test Core API
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        working-directory: ./api
        run: uv pip install -e ".[dev]"
      
      - name: Run linting
        working-directory: ./api
        run: |
          ruff check src/
          ruff format --check src/
      
      - name: Run type checking
        working-directory: ./api
        run: mypy src/
      
      - name: Run tests
        working-directory: ./api
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
        run: pytest tests/ -v --cov=src --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./api/coverage.xml
          flags: api
          name: api-coverage

  test-bff:
    name: Test BFF
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './bff/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./bff
        run: npm ci
      
      - name: Run linting
        working-directory: ./bff
        run: npm run lint
      
      - name: Run type checking
        working-directory: ./bff
        run: npm run typecheck
      
      - name: Run tests
        working-directory: ./bff
        run: npm test

  test-frontend:
    name: Test Frontend Applications
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        app: [shell, search-ui, domains-ui, ingestion-ui, admin-ui]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/apps/${{ matrix.app }}/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend/apps/${{ matrix.app }}
        run: npm ci
      
      - name: Run linting
        working-directory: ./frontend/apps/${{ matrix.app }}
        run: npm run lint || true
      
      - name: Build application
        working-directory: ./frontend/apps/${{ matrix.app }}
        run: npm run build

  # ==========================================================
  # BUILD STAGE
  # ==========================================================
  build-api:
    name: Build API Docker Image
    needs: test-api
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.API_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-bff:
    name: Build BFF Docker Image
    needs: test-bff
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.BFF_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./bff
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================
  # DEPLOY STAGE (Example - would need actual deployment config)
  # ==========================================================
  deploy-staging:
    name: Deploy to Staging
    needs: [build-api, build-bff]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add actual deployment commands here
          # Example: kubectl apply -f k8s/staging/
          # Example: docker-compose -f docker-compose.staging.yml up -d
      
      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke tests here
          # Example: curl -f http://staging-api/health

  deploy-production:
    name: Deploy to Production
    needs: [build-api, build-bff]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add actual deployment commands here
          # Example: kubectl apply -f k8s/production/
      
      - name: Run smoke tests
        run: |
          echo "Running production smoke tests..."
          # Add smoke tests here
